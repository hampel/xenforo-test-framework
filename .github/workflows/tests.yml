name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every PHP the package declares: floor, and the two above it.
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # The integration suite and PHPStan need XenForo, which is licensed and not
      # available to CI, so they run locally - see CLAUDE.md. These are the checks
      # that work without a forum.

      - name: composer.json is valid
        run: composer validate --strict

      - name: src/ parses on this PHP version
        run: find src -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      # Compiles every trait in src/Concerns with all diagnostics on. See
      # .github/deprecation-check.php for why it is limited to traits.
      - name: no deprecations or notices from src/Concerns
        run: php -d error_reporting=E_ALL .github/deprecation-check.php

  lowest:
    name: dependencies resolve at the floor
    runs-on: ubuntu-latest

    # Resolves the declared constraints at their floor and fails if they no longer
    # resolve. It does not prove the package runs on that tree, since the suite needs
    # XenForo - `composer check:lowest` does that locally before a release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          # the declared floor - the corner where an old dependency is resolved
          php-version: '8.3'
          coverage: none

      - name: the declared constraints still resolve at their floor
        run: composer update --prefer-lowest --prefer-dist --no-progress

      # the oldest resolvable tree is the one most likely to carry an advisory
      - name: no advisories against that tree
        run: composer audit

  style:
    name: code style
    runs-on: ubuntu-latest

    # One job, not one per PHP version: the ruleset is the same on all of them.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          coverage: none

      # Not setup-php's php-cs-fixer tool: the ruleset comes from XenForo's own
      # xenforo-ltd/xf-cs-fixer, and .php-cs-fixer.dist.php instantiates a class
      # out of it, so the standalone binary cannot read this config. update
      # rather than install, since this is a library and the lock is not committed.
      - run: composer update --prefer-dist --no-progress

      - name: src/ and tests/ match XenForo's coding standard
        run: composer format:check
